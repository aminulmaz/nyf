<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | HSL Night Cricket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #F9FAFB; }
        .font-heading { font-family: 'Inter', sans-serif; font-weight: 900; }
        .text-gradient { background-image: linear-gradient(90deg, #3b82f6, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .panel-modern { background-color: #1F2937; border: 1px solid #374151; border-radius: 0.75rem; }
        .form-input { background-color: #374151; border: 1px solid #4b5563; border-radius: 0.5rem; transition: all 0.2s ease; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); }
        .btn-primary { background-image: linear-gradient(90deg, #3b82f6 0%, #ec4899 100%); color: white; font-weight: 700; border-radius: 0.5rem; transition: all 0.3s ease; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
        .nav-tab { color: #9CA3AF; border-bottom: 2px solid transparent; }
        .nav-tab.active { color: #ec4899; border-bottom-color: #ec4899; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Login View -->
    <div id="login-container" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md">
            <h1 class="font-heading text-3xl text-center mb-8">Admin <span class="text-gradient">Login</span></h1>
            <form id="login-form" class="panel-modern p-8 space-y-6">
                <div>
                    <label for="email" class="block mb-2 font-semibold">Email</label>
                    <input type="email" id="email" class="form-input w-full p-3" required>
                </div>
                <div>
                    <label for="password" class="block mb-2 font-semibold">Password</label>
                    <input type="password" id="password" class="form-input w-full p-3" required>
                </div>
                <button type="submit" class="btn-primary w-full py-3 text-lg">Sign In</button>
                <p id="login-error" class="text-red-500 text-center h-4"></p>
            </form>
        </div>
    </div>

    <!-- Main Admin Panel (Hidden by default) -->
    <div id="admin-panel" class="hidden">
        <header class="bg-gray-900/80 backdrop-blur-sm border-b border-gray-700/50 sticky top-0 z-10">
            <div class="container mx-auto px-4 flex justify-between items-center py-4">
                <h1 class="text-2xl font-heading text-white">HSL<span class="text-gradient">Admin</span></h1>
                <button id="sign-out-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Sign Out</button>
            </div>
            <nav class="container mx-auto px-4 flex space-x-8">
                <button data-tab="registrations" class="nav-tab py-2 font-semibold active">Registrations</button>
                <button data-tab="announcements" class="nav-tab py-2 font-semibold">Announcements</button>
                <button data-tab="fixtures" class="nav-tab py-2 font-semibold">Fixtures</button>
            </nav>
        </header>

        <main class="container mx-auto p-4">
            <!-- Registrations Tab -->
            <div id="registrations-tab" class="tab-content">
                <h2 class="font-heading text-3xl mb-6">Player Registrations</h2>
                <div id="registrations-container" class="space-y-4"></div>
            </div>

            <!-- Announcements Tab -->
            <div id="announcements-tab" class="tab-content hidden">
                <h2 class="font-heading text-3xl mb-6">Manage Announcements</h2>
                <form id="announcement-form" class="panel-modern p-6 mb-8 space-y-4">
                     <div>
                        <label for="announcement-title" class="block mb-2 font-semibold">Title</label>
                        <input type="text" id="announcement-title" class="form-input w-full p-3" required>
                    </div>
                    <div>
                        <label for="announcement-content" class="block mb-2 font-semibold">Content</label>
                        <textarea id="announcement-content" class="form-input w-full p-3" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary py-3 px-6">Post Announcement</button>
                </form>
                <h3 class="font-heading text-2xl mt-8 mb-4">Current Announcements</h3>
                <div id="announcements-list" class="space-y-4"></div>
            </div>

            <!-- Fixtures Tab -->
            <div id="fixtures-tab" class="tab-content hidden">
                 <h2 class="font-heading text-3xl mb-6">Manage Fixtures</h2>
                 <form id="fixture-form" class="panel-modern p-6 mb-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                     <div>
                        <label for="teamA" class="block mb-2 font-semibold">Team A</label>
                        <input type="text" id="teamA" class="form-input w-full p-3" required>
                     </div>
                      <div>
                        <label for="teamB" class="block mb-2 font-semibold">Team B</label>
                        <input type="text" id="teamB" class="form-input w-full p-3" required>
                     </div>
                      <div>
                        <label for="match-date" class="block mb-2 font-semibold">Date & Time</label>
                        <input type="datetime-local" id="match-date" class="form-input w-full p-3" required>
                     </div>
                     <button type="submit" class="btn-primary py-3 px-6 h-12">Add Fixture</button>
                 </form>
                 <h3 class="font-heading text-2xl mt-8 mb-4">Current Fixtures</h3>
                 <div id="fixtures-list" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth();

        const loginContainer = document.getElementById('login-container');
        const adminPanel = document.getElementById('admin-panel');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const signOutBtn = document.getElementById('sign-out-btn');

        // --- AUTHENTICATION ---
        onAuthStateChanged(auth, user => {
            if (user) {
                // User is signed in
                loginContainer.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                initializeAdminPanel(); // Load Firestore data only after login
            } else {
                // User is signed out
                loginContainer.classList.remove('hidden');
                adminPanel.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginForm.email.value;
            const password = loginForm.password.value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginError.textContent = '';
            } catch (error) {
                console.error("Login failed:", error);
                loginError.textContent = 'Invalid email or password.';
            }
        });

        signOutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        // --- ADMIN PANEL LOGIC ---
        function initializeAdminPanel() {
            // Tab switching
            const tabs = document.querySelectorAll('.nav-tab');
            const tabContents = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const target = tab.dataset.tab;
                    tabContents.forEach(content => {
                        content.classList.toggle('hidden', content.id !== `${target}-tab`);
                    });
                });
            });

            // Registrations
            const registrationsContainer = document.getElementById('registrations-container');
            const qRegs = query(collection(db, "registrations"), orderBy("createdAt", "desc"));
            onSnapshot(qRegs, (snapshot) => {
                if(snapshot.empty) { registrationsContainer.innerHTML = '<p class="text-center text-gray-400">No pending registrations.</p>'; return; }
                registrationsContainer.innerHTML = snapshot.docs.map(docSnap => {
                    const reg = docSnap.data();
                    const id = docSnap.id;
                    const statusColor = reg.status === 'approved' ? 'text-green-400' : (reg.status === 'rejected' ? 'text-red-400' : 'text-yellow-400');
                    return `
                        <div class="panel-modern p-4 grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
                           <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <p><strong>Name:</strong> ${reg.fullName}</p>
                                <p><strong>Phone:</strong> ${reg.phone}</p>
                                <p><strong>Email:</strong> ${reg.email}</p>
                                <p><strong>Address:</strong> ${reg.address}</p>
                                <p><strong>Role:</strong> ${reg.playingRole}</p>
                                <p class="sm:col-span-2"><strong>Status:</strong> <span class="font-bold ${statusColor}">${reg.status.toUpperCase()}</span></p>
                                <div class="sm:col-span-2 flex gap-4">
                                    <a href="${reg.playerPhotoURL}" target="_blank" class="text-blue-400 hover:underline">View Photo</a>
                                    <a href="${reg.paymentProofURL}" target="_blank" class="text-blue-400 hover:underline">View Payment</a>
                                </div>
                           </div>
                           <div class="flex flex-col gap-2">
                                ${reg.status === 'pending' ? `
                                <button data-id="${id}" class="approve-btn bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">Approve</button>
                                <button data-id="${id}" class="reject-btn bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md">Reject</button>
                                ` : ''}
                           </div>
                        </div>
                    `;
                }).join('');
            });

            registrationsContainer.addEventListener('click', async e => {
                const id = e.target.dataset.id;
                if (!id) return;
                const regRef = doc(db, 'registrations', id);
                if (e.target.classList.contains('approve-btn')) {
                    await updateDoc(regRef, { status: 'approved' });
                } else if (e.target.classList.contains('reject-btn')) {
                    await updateDoc(regRef, { status: 'rejected' });
                }
            });

            // Announcements
            const announcementForm = document.getElementById('announcement-form');
            const announcementsList = document.getElementById('announcements-list');
            const qAnns = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
            onSnapshot(qAnns, snapshot => {
                if(snapshot.empty) { announcementsList.innerHTML = '<p class="text-gray-400">No announcements yet.</p>'; return; }
                announcementsList.innerHTML = snapshot.docs.map(docSnap => {
                    const ann = docSnap.data();
                    return `<div class="panel-modern p-4 flex justify-between items-start"><div><h4 class="font-bold text-lg">${ann.title}</h4><p class="text-gray-400">${ann.content}</p></div><button data-id="${docSnap.id}" class="delete-ann-btn text-red-500 hover:text-red-400">&times;</button></div>`;
                }).join('');
            });

            announcementForm.addEventListener('submit', async e => {
                e.preventDefault();
                await addDoc(collection(db, 'announcements'), {
                    title: announcementForm['announcement-title'].value,
                    content: announcementForm['announcement-content'].value,
                    createdAt: serverTimestamp()
                });
                announcementForm.reset();
            });

            announcementsList.addEventListener('click', async e => {
                if(e.target.classList.contains('delete-ann-btn')) {
                    if(confirm('Are you sure you want to delete this announcement?')) {
                        await deleteDoc(doc(db, 'announcements', e.target.dataset.id));
                    }
                }
            });
            
            // Fixtures
            const fixtureForm = document.getElementById('fixture-form');
            const fixturesList = document.getElementById('fixtures-list');
            const qFixs = query(collection(db, "fixtures"), orderBy("matchDate", "asc"));
            onSnapshot(qFixs, snapshot => {
                 if(snapshot.empty) { fixturesList.innerHTML = '<p class="text-gray-400">No fixtures added yet.</p>'; return; }
                 fixturesList.innerHTML = snapshot.docs.map(docSnap => {
                    const fix = docSnap.data();
                    const matchDate = fix.matchDate.toDate();
                    return `<div class="panel-modern p-4 flex justify-between items-center"><div><p class="font-semibold text-lg">${fix.teamA} <span class="text-gradient mx-2">VS</span> ${fix.teamB}</p><p class="text-gray-400 text-sm">${matchDate.toLocaleString()}</p></div><button data-id="${docSnap.id}" class="delete-fix-btn text-red-500 hover:text-red-400">&times;</button></div>`;
                 }).join('');
            });
            
            fixtureForm.addEventListener('submit', async e => {
                e.preventDefault();
                const matchDate = new Date(fixtureForm['match-date'].value);
                await addDoc(collection(db, 'fixtures'), {
                    teamA: fixtureForm.teamA.value,
                    teamB: fixtureForm.teamB.value,
                    matchDate: matchDate,
                    matchTime: matchDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                fixtureForm.reset();
            });
            
            fixturesList.addEventListener('click', async e => {
                if(e.target.classList.contains('delete-fix-btn')) {
                    if(confirm('Are you sure you want to delete this fixture?')) {
                        await deleteDoc(doc(db, 'fixtures', e.target.dataset.id));
                    }
                }
            });
        }
    </script>
</body>
</html>
