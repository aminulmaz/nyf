<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | HSL Night Cricket Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0c0c1e;
            color: #e0e0e0;
            overflow: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .title-glow {
            text-shadow: 0 0 5px rgba(0, 191, 255, 0.7), 0 0 10px rgba(0, 191, 255, 0.7), 0 0 20px rgba(255, 0, 255, 0.7);
        }
        #plexus-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .content-container {
            position: relative;
            z-index: 2;
        }
        .glass-panel {
            background: rgba(12, 12, 30, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 191, 255, 0.2);
            border-radius: 1rem;
        }
        .countdown-box {
             clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <canvas id="plexus-canvas"></canvas>

    <div class="content-container text-center p-4">
        <div class="glass-panel p-8 sm:p-12 max-w-4xl mx-auto">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-orbitron font-black uppercase title-glow">Launching Soon</h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-blue-300 mt-4">Haji Sujamuddin Laskar Night Cricket Tournament</h2>
            <p class="text-gray-300 mt-4 max-w-2xl mx-auto">
                Get ready for the most electrifying tournament of the year. Our new website is currently under construction and will be live in:
            </p>

            <div id="countdown" class="flex justify-center space-x-2 sm:space-x-4 my-8">
                <!-- Countdown timer will be injected here -->
            </div>

            <p class="text-gray-400">Follow us for updates:</p>
            <div class="flex justify-center space-x-6 mt-4">
                <a href="#" class="hover:text-blue-400 transition-colors"><i class="ph-facebook-logo text-3xl"></i></a>
                <a href="#" class="hover:text-blue-400 transition-colors"><i class="ph-twitter-logo text-3xl"></i></a>
                <a href="#" class="hover:text-blue-400 transition-colors"><i class="ph-instagram-logo text-3xl"></i></a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- COUNTDOWN TIMER ---
            const countdownElement = document.getElementById('countdown');
            // Set the date we're counting down to (2 days from now, at 6 PM IST)
            const countDownDate = new Date("October 15, 2025 18:00:00").getTime();

            const countdownInterval = setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    countdownElement.innerHTML = `<div class="w-full text-2xl font-orbitron font-bold title-glow">WE ARE LIVE!</div>`;
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownElement.innerHTML = `
                    <div class="glass-panel p-3 rounded-lg w-20 sm:w-24 text-center countdown-box"><div class="text-3xl sm:text-4xl font-orbitron font-bold">${days}</div><div class="text-xs uppercase">Days</div></div>
                    <div class="glass-panel p-3 rounded-lg w-20 sm:w-24 text-center countdown-box"><div class="text-3xl sm:text-4xl font-orbitron font-bold">${hours}</div><div class="text-xs uppercase">Hours</div></div>
                    <div class="glass-panel p-3 rounded-lg w-20 sm:w-24 text-center countdown-box"><div class="text-3xl sm:text-4xl font-orbitron font-bold">${minutes}</div><div class="text-xs uppercase">Minutes</div></div>
                    <div class="glass-panel p-3 rounded-lg w-20 sm:w-24 text-center countdown-box"><div class="text-3xl sm:text-4xl font-orbitron font-bold">${seconds}</div><div class="text-xs uppercase">Seconds</div></div>
                `;
            }, 1000);

            // --- PLEXUS BACKGROUND ANIMATION ---
            const canvas = document.getElementById('plexus-canvas');
            if(canvas) {
                const ctx = canvas.getContext('2d');
                let width, height, particles;

                function init() {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                    particles = [];
                    const numParticles = Math.floor(width * height / 15000);
                    for (let i = 0; i < numParticles; i++) particles.push(new Particle());
                }

                class Particle {
                    constructor() {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.size = Math.random() * 1.5 + 1;
                        this.speedX = Math.random() * 2 - 1;
                        this.speedY = Math.random() * 2 - 1;
                        this.color = '#00BFFF';
                    }
                    update() {
                        if (this.x > width || this.x < 0) this.speedX *= -1;
                        if (this.y > height || this.y < 0) this.speedY *= -1;
                        this.x += this.speedX;
                        this.y += this.speedY;
                    }
                    draw() {
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                function handleParticles() {
                    for (let i = 0; i < particles.length; i++) {
                        particles[i].update();
                        particles[i].draw();
                        for (let j = i; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < 100) {
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(0, 191, 255, ${1 - distance / 100})`;
                                ctx.lineWidth = 0.5;
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();
                            }
                        }
                    }
                }

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    handleParticles();
                    requestAnimationFrame(animate);
                }

                init();
                animate();
                window.addEventListener('resize', init);
            }
        });
    </script>
</body>
</html>
