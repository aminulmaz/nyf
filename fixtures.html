<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixtures & Schedule - NYF Tournament</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #1a202c;
            --bg-secondary: #2d3748;
            --primary-blue: #4f46e5;
            --accent-violet: #a855f7;
            --text-light: #ffffff;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
        }

        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            box-sizing: border-box;
        }
        @media (min-width: 1024px) { .container { max-width: 1024px; } }
        
        h1, h2, h3 {
             font-family: 'Teko', sans-serif;
             font-weight: 700;
             line-height: 1.1;
        }

       /* Header */
        .header {
            background-color: rgba(26, 32, 44, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 50;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
        }
        .nav-brand {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem; 
            text-decoration: none; 
            color: var(--text-light);
        }
        .nav-links { display: none; }
        @media (min-width: 1024px) {
            .nav-links {
                display: flex; align-items: center;
                gap: 2rem; font-size: 1rem;
            }
        }
        .nav-links a { text-decoration: none; color: var(--text-muted); transition: color 0.3s ease; font-weight: 500; }
        .nav-links a.active { color: var(--accent-violet); font-weight: 700; }
        .nav-links a:not(.active):hover { color: var(--text-light); }
        
        #mobile-menu-button { display: block; background: none; border: none; color: white; cursor: pointer; }
        @media (min-width: 1024px) { #mobile-menu-button { display: none; } }
        #mobile-menu { display: none; padding: 0 1.5rem 1rem; background-color: var(--bg-secondary); }
        #mobile-menu a { display: block; padding: 0.75rem 0; text-decoration: none; color: var(--text-muted); }
        
        main { padding: 4rem 0; }
        .section-title {
            text-align: center;
            font-size: 4rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--primary-blue), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Fixture List */
        .fixture-list {
            display: grid;
            gap: 1.5rem;
        }
        .fixture-card {
            background-color: var(--bg-secondary);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            display: grid;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
        }
        @media (min-width: 768px) {
            .fixture-card {
                grid-template-columns: 1fr auto 1fr;
                text-align: left;
            }
        }
        .team {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .team-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
        }
        .team-name {
            font-size: 1.75rem;
            font-family: 'Teko', sans-serif;
            margin: 0;
        }
        .versus {
            font-size: 2.5rem;
            font-family: 'Teko', sans-serif;
            color: var(--accent-violet);
        }
        @media (min-width: 768px) {
            .team.team-b {
                flex-direction: row-reverse;
                text-align: right;
            }
        }

        .match-details {
            grid-column: 1 / -1;
            border-top: 1px solid var(--border-color);
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            text-align: center;
            color: var(--text-muted);
        }

        .placeholder-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.25rem;
            padding: 3rem;
            background-color: var(--bg-secondary);
            border-radius: 0.5rem;
        }

        /* Footer */
        .footer {
            background-color: #111827; color: var(--text-muted);
            padding: 4rem 1.5rem; margin-top: 4rem; text-align: center;
        }
        .copyright { font-size: 0.875rem; }
    </style>
</head>
<body>

    <header class="header">
        <nav class="container nav">
            <a href="index.html" class="nav-brand">NYF</a>
             <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="fixtures.html" class="active">Fixtures</a>
                <a href="rules.html">Rules</a>
                <a href="player-registration.html">Player Registration</a>
                <a href="faq.html">FAQ</a>
            </div>
            <button id="mobile-menu-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            </button>
        </nav>
        <div id="mobile-menu"></div>
    </header>

    <main>
        <div class="container">
            <h1 class="section-title">Match Schedule</h1>

            <div class="fixture-list" id="fixture-list">
                <!-- Fixtures will be loaded here -->
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="container copyright">
            <p>Developed by Aminul Mazumder.</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links').cloneNode(true);
        mobileMenu.appendChild(navLinks);
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block';
        });
    </script>
    
    <script src="firebaseconfig.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const fixtureList = document.getElementById('fixture-list');
        const fixturesQuery = query(collection(db, 'fixtures'), orderBy('matchDate', 'asc'));

        onSnapshot(fixturesQuery, (snapshot) => {
            if (snapshot.empty) {
                fixtureList.innerHTML = '<p class="placeholder-text">The official match schedule will be announced soon. Stay tuned!</p>';
                return;
            }
            fixtureList.innerHTML = '';
            snapshot.forEach(doc => {
                const match = doc.data();
                const card = document.createElement('div');
                card.className = 'fixture-card';
                card.innerHTML = `
                    <div class="team team-a">
                        <div class="team-logo">${match.teamA.charAt(0)}</div>
                        <h3 class="team-name">${match.teamA}</h3>
                    </div>
                    <div class="versus">VS</div>
                    <div class="team team-b">
                        <div class="team-logo">${match.teamB.charAt(0)}</div>
                        <h3 class="team-name">${match.teamB}</h3>
                    </div>
                    <div class="match-details">
                        <strong>Date:</strong> ${new Date(match.matchDate).toLocaleDateString()} | 
                        <strong>Time:</strong> ${match.matchTime} | 
                        <strong>Venue:</strong> ${match.venue}
                    </div>
                `;
                fixtureList.appendChild(card);
            });
        });
    </script>
</body>
</html>
