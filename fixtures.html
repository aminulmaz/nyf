<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixtures & Schedule - NYF Tournament</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #1a202c; 
            --bg-secondary: #2d3748; 
            --primary-blue: #4f46e5; 
            --accent-violet: #a855f7; 
            --text-light: #ffffff; 
            --text-muted: #a0aec0; 
            --border-color: #4a5568; 
        }
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            margin: 0; 
        }
        h1, h2 {
             font-family: 'Teko', sans-serif;
             font-weight: 700;
             line-height: 1.1;
        }
        .header { 
            background: linear-gradient(to right, #8e2de2, #4a00e0); 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
        }
        .nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.5rem 1rem; 
            max-width: 1280px; 
            margin: 0 auto;
        }
        .nav-brand img { height: 50px; }
        .nav-links { display: none; }
        @media (min-width: 1024px) { 
            .nav-links { 
                display: flex; 
                align-items: center; 
                gap: 1.5rem; 
                font-size: 0.875rem; 
            } 
        }
        .nav-links a { text-decoration: none; color: white; }
        #mobile-menu-button { display: block; background: none; border: none; color: white; cursor: pointer; }
        @media (min-width: 1024px) { #mobile-menu-button { display: none; } }
        #mobile-menu { display: none; padding: 0 1.5rem 1rem; background: linear-gradient(to right, #8e2de2, #4a00e0); }
        #mobile-menu a { display: block; padding: 0.75rem 0; text-decoration: none; color: white; }
        .container { max-width: 900px; margin: 2rem auto; padding: 1rem; }
        h1 { 
            font-size: 3rem; 
            text-align: center; 
            background: linear-gradient(to right, var(--primary-blue), var(--accent-violet)); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }
        .fixtures-grid { display: grid; gap: 1.5rem; }
        .fixture-card { 
            background-color: var(--bg-secondary); 
            border-radius: 0.75rem; 
            border: 1px solid var(--border-color); 
            padding: 1.5rem; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .fixture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
        }
        .team { 
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: 'Teko', sans-serif; 
            font-size: 1.5rem; 
        }
        @media (min-width: 640px) { .team { font-size: 2rem; } }
        .team-logo {
            width: 40px;
            height: 40px;
            background-color: var(--bg-dark);
            border-radius: 50%;
            padding: 5px;
            object-fit: contain;
        }
        .team-a { justify-content: flex-end; }
        .team-b { justify-content: flex-start; flex-direction: row-reverse; }
        .vs { font-size: 1.25rem; font-weight: 700; color: var(--accent-violet); }
        .match-details { 
            grid-column: 1 / -1; 
            border-top: 1px solid var(--border-color); 
            margin-top: 1.5rem; 
            padding-top: 1rem; 
            text-align: center; 
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .placeholder-text { text-align: center; padding: 2rem; font-size: 1.1rem; }
         .footer { background-color: #111827; padding: 3rem 0; margin-top: 3rem; text-align: center; }
        .copyright { font-size: 0.875rem; border-top: 1px solid var(--border-color); padding-top: 2rem; max-width: 1280px; margin: 0 auto; }
        .developer-name {
            font-weight: 700;
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="nav-brand"><img src="media/logo.jpg" alt="NYF Logo"></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Tournament</a>
                <a href="fixtures.html" class="active">Fixtures</a>
                <a href="rules.html">Rules & Regulations</a>
                <a href="player-registration.html">Player Registration</a>
                <a href="contact.html">Contact</a>
            </div>
            <button id="mobile-menu-button"><svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" fill="none" viewBox="0 0 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
        </nav>
        <div id="mobile-menu"></div>
    </header>
    <div class="container">
        <h1>Match Schedule</h1>
        <div id="fixtures-grid" class="fixtures-grid"></div>
    </div>
    <footer class="footer"><div class="copyright">Developed by <span class="developer-name">Aminul Mazumder</span></div></footer>
    <script>
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinksContainer = document.querySelector('.nav-links');
        mobileMenu.innerHTML = '';
        navLinksContainer.querySelectorAll('a').forEach(link => { mobileMenu.appendChild(link.cloneNode(true)); });
        mobileMenuButton.addEventListener('click', () => { mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block'; });
    </script>
    <script src="firebaseconfig.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const fixturesGrid = document.getElementById('fixtures-grid');
        onSnapshot(query(collection(db, "fixtures"), orderBy("matchDate", "asc")), (snapshot) => {
            if (snapshot.empty) {
                fixturesGrid.innerHTML = `<p class="placeholder-text">Fixtures have not been announced yet.</p>`; return;
            }
            fixturesGrid.innerHTML = snapshot.docs.map(doc => {
                const f = doc.data();
                const matchDate = new Date(f.matchDate).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                return `
                <div class="fixture-card">
                    <div class="team team-a">
                        <span>${f.teamA}</span>
                        <img src="https://placehold.co/50x50/1a202c/ffffff?text=${f.teamA.charAt(0)}" alt="${f.teamA} Logo" class="team-logo">
                    </div>
                    <div class="vs">VS</div>
                    <div class="team team-b">
                        <img src="https://placehold.co/50x50/1a202c/ffffff?text=${f.teamB.charAt(0)}" alt="${f.teamB} Logo" class="team-logo">
                        <span>${f.teamB}</span>
                    </div>
                    <div class="match-details">${matchDate} at ${f.matchTime} | ${f.venue}</div>
                </div>`;
            }).join('');
        });
    </script>
</body>
</html>
