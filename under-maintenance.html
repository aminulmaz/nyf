<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - NYF Tournament</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a202c;
            --primary-blue: #4f46e5;
            --accent-violet: #a855f7;
            --text-light: #ffffff;
            --text-muted: #a0aec0;
            --tool-color: #f7b733;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 2rem;
        }

        .animation-container {
            position: relative;
            width: 200px;
            height: 150px;
            margin: 0 auto 2rem auto;
        }

        .tool {
            position: absolute;
            width: 80px;
            height: 80px;
            fill: var(--tool-color);
        }

        .wrench {
            top: 20px;
            left: 20px;
            animation: rotate-wrench 3s ease-in-out infinite;
        }

        .hammer {
            bottom: 20px;
            right: 20px;
            animation: tap-hammer 1.5s ease-in-out infinite;
        }
        
        @keyframes rotate-wrench {
            0%, 100% { transform: rotate(-25deg); }
            50% { transform: rotate(25deg); }
        }

        @keyframes tap-hammer {
            0%, 100% { transform: rotate(15deg) translateY(0); }
            50% { transform: rotate(35deg) translateY(-10px); }
        }


        .error-code {
            font-family: 'Teko', sans-serif;
            font-size: 5rem;
            line-height: 1;
            background: linear-gradient(to right, var(--primary-blue), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            margin: 0 0 1rem 0;
        }
        
        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="animation-container">
            <svg class="tool wrench" viewBox="0 0 24 24"><path d="M14.75 2.5a1.25 1.25 0 0 1 1.768 0l2.474 2.475a1.25 1.25 0 0 1 0 1.768l-1.99 1.99-3.535-3.536L14.75 2.5zM12.28 7.47a.75.75 0 0 0-1.06 0L2.808 15.882a.75.75 0 0 0 0 1.061l3.535 3.535a.75.75 0 0 0 1.06 0l8.414-8.414a.75.75 0 0 0 0-1.06L12.28 7.47z M8.217 18.25a.75.75 0 0 1-1.06 0l-.707-.707a.75.75 0 0 1 0-1.06l1.767-1.768 1.768 1.768-1.768 1.767z"></path></svg>
            <svg class="tool hammer" viewBox="0 0 24 24"><path d="M18.823 6.643l-1.414 1.414-5.303-5.303 1.414-1.414a1 1 0 0 1 1.414 0l3.89 3.89a1 1 0 0 1 0 1.414zM16 8l-6-6-8 8 6 6L16 8z"></path></svg>
        </div>
        <div class="error-code">Server Under Maintenance</div>
        <h1>Strategic Timeout!</h1>
        <p>We're making some improvements and will be back on the field shortly. Thanks for your patience.</p>
    </div>
</body>
</html>
