<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLA Haji Suzam Uddin Laskar Night Cricket Tournament</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #1a202c;
            --bg-secondary: #2d3748;
            --primary-blue: #4f46e5;
            --accent-violet: #a855f7;
            --text-light: #ffffff;
            --text-muted: #a0aec0;
            --border-color: #4a5568;
        }

        /* General Styles */
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            box-sizing: border-box;
        }
        @media (min-width: 1280px) { .container { max-width: 1280px; } }
        
        h1, h2, h3 {
             font-family: 'Teko', sans-serif;
             font-weight: 700;
             line-height: 1.1;
        }

        /* Scroll Animations */
        .fade-in-section {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Header */
        .header {
            background-color: rgba(26, 32, 44, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 50;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
        }
        .nav-brand {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem; 
            text-decoration: none; 
            color: var(--text-light);
        }
        .nav-links { display: none; }
        @media (min-width: 1024px) {
            .nav-links {
                display: flex; align-items: center;
                gap: 2rem; font-size: 1rem;
            }
        }
        .nav-links a { text-decoration: none; color: var(--text-muted); transition: color 0.3s ease; font-weight: 500; }
        .nav-links a.active { color: var(--accent-violet); font-weight: 700; }
        .nav-links a:not(.active):hover { color: var(--text-light); }
        
        #mobile-menu-button { display: block; background: none; border: none; color: white; cursor: pointer; }
        @media (min-width: 1024px) { #mobile-menu-button { display: none; } }
        #mobile-menu { display: none; padding: 0 1.5rem 1rem; background-color: var(--bg-secondary); }
        #mobile-menu a { display: block; padding: 0.75rem 0; text-decoration: none; color: var(--text-muted); }

        /* Hero Section */
        .hero {
            position: relative;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            color: white;
        }
        .hero-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }
        .hero-slide.active { opacity: 1; }
        .hero-slide::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
        }
        .hero-content {
            z-index: 2;
            padding: 1.5rem;
        }
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            margin-bottom: 1rem;
        }
        @media(min-width: 768px) { .hero-content h1 { font-size: 4.5rem; } }
        .hero-content p {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto 2rem auto;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }
        .hero-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 0.75rem 2rem;
            text-decoration: none;
            border-radius: 0.375rem;
            font-weight: 700;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary { 
            background: linear-gradient(to right, var(--primary-blue), var(--accent-violet));
            color: white;
            text-transform: uppercase;
        }
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); 
        }

        /* General Section Styling */
        .section { padding: 5rem 0; }
        .section-title {
            text-align: center;
            font-size: 4rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--primary-blue), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        
        /* Announcements */
        .announcements { background-color: var(--bg-secondary); }
        .announcement-grid {
            display: grid; gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }
        .announcement-card {
            background: linear-gradient(145deg, #3a475d, #252e3d);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .announcement-card:hover {
            border-color: var(--accent-violet);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .announcement-card h3 { margin: 0 0 0.75rem 0; font-size: 1.75rem; color: var(--accent-violet); }
        .announcement-card p { margin: 0; color: var(--text-muted); }
        
        /* Teams Section */
        .teams-grid { display: grid; gap: 1.5rem; }
        @media(min-width: 640px) { .teams-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1024px) { .teams-grid { grid-template-columns: repeat(4, 1fr); } }
        .team-card {
            background-color: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .team-card h3 { margin: 0 0 0.5rem 0; font-size: 1.75rem; }
        .team-card p { color: var(--text-muted); margin: 0; }

        /* Gallery Section */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .gallery-item {
            overflow: hidden;
            border-radius: 0.5rem;
            position: relative;
            background-color: #111827;
            height: 250px;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* This prevents cropping */
            display: block;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Sponsors Section */
        .sponsors-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; gap: 3rem;
        }
        .sponsor-logo {
            filter: grayscale(100%) opacity(0.7);
            transition: all 0.3s ease;
        }
        .sponsor-logo:hover {
            filter: grayscale(0%) opacity(1);
            transform: scale(1.1);
        }
        
        /* Footer */
        .footer {
            background-color: #111827; color: var(--text-muted);
            padding: 4rem 1.5rem; margin-top: 4rem; text-align: center;
        }
        .footer .nav-brand { display: inline-block; margin-bottom: 1.5rem; }
        .footer-links {
            display: flex; justify-content: center; gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .footer-links a { text-decoration: none; color: var(--text-muted); transition: color 0.3s ease; }
        .footer-links a:hover { color: white; }
        .copyright {
            margin-top: 2rem; font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }
        
        .placeholder-text {
            grid-column: 1 / -1; /* Span full width in grid */
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 2rem;
        }

    </style>
</head>
<body>

    <header class="header">
        <nav class="container nav">
            <a href="#" class="nav-brand">NYF</a>
             <div class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="fixtures.html">Fixtures</a>
                <a href="rules.html">Rules</a>
                <a href="player-registration.html">Player Registration</a>
            </div>
            <button id="mobile-menu-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            </button>
        </nav>
        <div id="mobile-menu"></div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-slide active" style="background-image: url('media/slider1.jpg');"></div>
            <div class="hero-slide" style="background-image: url('media/slider2.jpg');"></div>
            <div class="hero-slide" style="background-image: url('media/slider3.jpg');"></div>

            <div class="hero-content">
                <h1>MLA Haji Suzam Uddin Laskar<br>Night Cricket Tournament</h1>
                <p>Organised by Narainpur Youth Federation</p>
                <div class="hero-buttons">
                    <a href="player-registration.html" class="btn btn-primary">Register as a Player</a>
                </div>
            </div>
        </section>
        
        <!-- Announcements Section -->
        <section class="section announcements fade-in-section">
            <div class="container">
                <h2 class="section-title">Latest Updates</h2>
                <div class="announcement-grid" id="announcements-grid">
                    <!-- Placeholder will be shown by JS if empty -->
                </div>
            </div>
        </section>

        <!-- Teams Section -->
        <section class="section fade-in-section">
            <div class="container">
                <h2 class="section-title">Participating Teams</h2>
                <div class="teams-grid" id="teams-grid">
                    <!-- Placeholder will be shown by JS if empty -->
                </div>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="section fade-in-section">
            <div class="container">
                <h2 class="section-title">Gallery</h2>
                <div class="gallery-grid">
                    <div class="gallery-item">
                        <img src="media/gallery1.jpg" alt="Gallery Image 1" onerror="this.onerror=null;this.src='https://placehold.co/400x300/111827/a0aec0?text=Highlight+1';">
                    </div>
                    <div class="gallery-item">
                        <img src="media/gallery2.jpg" alt="Gallery Image 2" onerror="this.onerror=null;this.src='https://placehold.co/400x300/111827/a0aec0?text=Highlight+2';">
                    </div>
                    <div class="gallery-item">
                        <img src="media/gallery3.jpg" alt="Gallery Image 3" onerror="this.onerror=null;this.src='https://placehold.co/400x300/111827/a0aec0?text=Highlight+3';">
                    </div>
                     <div class="gallery-item">
                        <img src="media/gallery4.jpg" alt="Gallery Image 4" onerror="this.onerror=null;this.src='https://placehold.co/400x300/111827/a0aec0?text=Highlight+4';">
                    </div>
                </div>
            </div>
        </section>

        <!-- Our Sponsors -->
        <section class="section fade-in-section">
            <div class="container">
                <h2 class="section-title">Our Partners</h2>
                <div class="sponsors-grid">
                    <img src="https://placehold.co/150x60/1a202c/a0aec0?text=Sponsor+1" alt="Sponsor 1" class="sponsor-logo">
                    <img src="https://placehold.co/150x60/1a202c/a0aec0?text=Sponsor+2" alt="Sponsor 2" class="sponsor-logo">
                    <img src="https://placehold.co/150x60/1a202c/a0aec0?text=Sponsor+3" alt="Sponsor 3" class="sponsor-logo">
                    <img src="https://placehold.co/150x60/1a202c/a0aec0?text=Sponsor+4" alt="Sponsor 4" class="sponsor-logo">
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <a href="#" class="nav-brand">NYF</a>
             <div class="footer-links">
                <a href="#">Home</a>
                <a href="fixtures.html">Fixtures</a>
                <a href="rules.html">Rules</a>
                <a href="player-registration.html">Player Registration</a>
            </div>
            <div class="copyright">
                <p>Developed by Aminul Mazumder.</p>
            </div>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links').cloneNode(true);
        mobileMenu.appendChild(navLinks);

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block';
        });

        // Hero Slider
        let currentSlide = 0;
        const slides = document.querySelectorAll('.hero-slide');
        if (slides.length > 0) {
            const slideInterval = setInterval(nextSlide, 5000);
            function nextSlide() {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }
        
        // Scroll Animations
        const sections = document.querySelectorAll('.fade-in-section');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });

        sections.forEach(section => {
            observer.observe(section);
        });
    </script>
    
    <script src="firebaseconfig.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Load Announcements
        const announcementsGrid = document.getElementById('announcements-grid');
        const announcementsQuery = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'), limit(4));
        onSnapshot(announcementsQuery, (snapshot) => {
            if (snapshot.empty) {
                announcementsGrid.innerHTML = '<p class="placeholder-text">No announcements have been made yet.</p>';
                return;
            }
            announcementsGrid.innerHTML = '';
            snapshot.forEach(doc => {
                const announcement = doc.data();
                const card = document.createElement('div');
                card.className = 'announcement-card';
                card.innerHTML = `
                    <h3>${announcement.headline}</h3>
                    <p>${announcement.text}</p>
                `;
                announcementsGrid.appendChild(card);
            });
        });

        // Load Approved Teams
        const teamsGrid = document.getElementById('teams-grid');
        const teamsQuery = query(collection(db, 'approved_teams'));
        onSnapshot(teamsQuery, (snapshot) => {
            if (snapshot.empty) {
                teamsGrid.innerHTML = '<p class="placeholder-text">No teams have been added yet.</p>';
                return;
            }
            teamsGrid.innerHTML = '';
            snapshot.forEach(doc => {
                const team = doc.data();
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <h3>${team.teamName}</h3>
                    <p>${team.city}</p>
                `;
                teamsGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
