<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellar Defense: Asteroid Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevents scrolling while playing */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
        }
        .btn {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 12px 32px;
            border-radius: 9999px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            height: 150px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }
        .joystick-container {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .shoot-btn {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.4);
            border: 3px solid rgba(239, 68, 68, 0.6);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            user-select: none;
        }
        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="flex justify-between items-start pointer-events-none">
            <div class="text-2xl font-bold text-indigo-400">SCORE: <span id="scoreVal">0</span></div>
            <div class="text-xl font-medium text-pink-400">LIVES: <span id="livesVal">3</span></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
        <h1 class="text-5xl font-black mb-4 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-500">STELLAR DEFENSE</h1>
        <p class="text-gray-400 max-w-md text-center px-6">Navigate your ship through the asteroid belt. Destroy them before they destroy you.</p>
        <div class="mt-8 text-sm text-gray-500 hidden md:block">
            Arrows/WASD to Move &bull; Space to Shoot
        </div>
        <button class="btn" onclick="startGame()">Launch Mission</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay hidden">
        <h2 class="text-4xl font-bold mb-2 text-red-500">SHIP DESTROYED</h2>
        <p class="text-xl mb-6">Final Score: <span id="finalScore">0</span></p>
        <button class="btn" onclick="startGame()">Try Again</button>
    </div>

    <!-- Mobile UI Controls -->
    <div id="mobile-controls">
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="shoot-btn" id="shootBtn">FIRE</div>
    </div>

    <script>
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const livesVal = document.getElementById('livesVal');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreText = document.getElementById('finalScore');
        
        // Game Constants
        const FPS = 60;
        const FRICTION = 0.97;
        const SHIP_SIZE = 20;
        const SHIP_THRUST = 0.4;
        const SHIP_TURN_SPEED = 0.08;
        const BULLET_SPEED = 8;
        const ASTEROID_MAX_SPEED = 2;
        const ASTEROID_MIN_SPEED = 0.5;
        const ASTEROID_COUNT = 5;
        const ASTEROID_SIZE = 50;

        let score = 0;
        let lives = 3;
        let gameActive = false;
        let ship;
        let asteroids = [];
        let bullets = [];
        let particles = [];
        let keys = {};
        
        // Mobile State
        let joystickActive = false;
        let joystickPos = { x: 0, y: 0 };
        let joystickOrigin = { x: 0, y: 0 };
        let mobileThrust = 0;
        let mobileRotation = 0;
        let isMobileShooting = false;

        class Ship {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.r = SHIP_SIZE;
                this.angle = -Math.PI / 2;
                this.rot = 0;
                this.thrusting = false;
                this.vel = { x: 0, y: 0 };
                this.blinkTime = 0;
                this.blinkOn = true;
                this.lastShot = 0;
                this.invulnerable = false;
            }

            draw() {
                if (this.invulnerable && !this.blinkOn) return;

                ctx.strokeStyle = this.invulnerable ? "#facc15" : "#6366f1";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(
                    this.x + this.r * Math.cos(this.angle),
                    this.y + this.r * Math.sin(this.angle)
                );
                ctx.lineTo(
                    this.x - this.r * (Math.cos(this.angle) - Math.sin(this.angle)),
                    this.y - this.r * (Math.sin(this.angle) + Math.cos(this.angle))
                );
                ctx.lineTo(
                    this.x - this.r * (Math.cos(this.angle) + Math.sin(this.angle)),
                    this.y - this.r * (Math.sin(this.angle) - Math.cos(this.angle))
                );
                ctx.closePath();
                ctx.stroke();

                // Engine flame
                if (this.thrusting) {
                    ctx.fillStyle = "#ec4899";
                    ctx.beginPath();
                    ctx.moveTo(
                        this.x - this.r * Math.cos(this.angle) * 0.5,
                        this.y - this.r * Math.sin(this.angle) * 0.5
                    );
                    ctx.lineTo(
                        this.x - this.r * 1.5 * Math.cos(this.angle) + (Math.random() * 10 - 5),
                        this.y - this.r * 1.5 * Math.sin(this.angle) + (Math.random() * 10 - 5)
                    );
                    ctx.lineTo(
                        this.x - this.r * Math.cos(this.angle) * 0.5,
                        this.y - this.r * Math.sin(this.angle) * 0.5
                    );
                    ctx.stroke();
                }
            }

            update() {
                // Rotation
                this.angle += this.rot;

                // Thrust
                if (this.thrusting) {
                    this.vel.x += SHIP_THRUST * Math.cos(this.angle);
                    this.vel.y += SHIP_THRUST * Math.sin(this.angle);
                }

                // Friction
                this.vel.x *= FRICTION;
                this.vel.y *= FRICTION;

                // Move
                this.x += this.vel.x;
                this.y += this.vel.y;

                // Screen Wrap
                if (this.x < 0 - this.r) this.x = canvas.width + this.r;
                else if (this.x > canvas.width + this.r) this.x = 0 - this.r;
                if (this.y < 0 - this.r) this.y = canvas.height + this.r;
                else if (this.y > canvas.height + this.r) this.y = 0 - this.r;

                // Handle Blinking
                if (this.invulnerable) {
                    this.blinkTime--;
                    if (this.blinkTime % 10 === 0) this.blinkOn = !this.blinkOn;
                    if (this.blinkTime <= 0) this.invulnerable = false;
                }
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShot < 150) return;
                
                bullets.push(new Bullet(
                    this.x + this.r * Math.cos(this.angle),
                    this.y + this.r * Math.sin(this.angle),
                    this.angle
                ));
                this.lastShot = now;
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * BULLET_SPEED;
                this.vy = Math.sin(angle) * BULLET_SPEED;
                this.dist = 0;
                this.maxDist = canvas.width;
            }

            draw() {
                ctx.fillStyle = "#fb7185";
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.dist += Math.sqrt(this.vx**2 + this.vy**2);
                
                // Return true if bullet should be removed
                return this.dist > this.maxDist;
            }
        }

        class Asteroid {
            constructor(x, y, r, level = 3) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.r = r || ASTEROID_SIZE;
                this.level = level; // 3: Big, 2: Med, 1: Small
                
                const speed = Math.random() * (ASTEROID_MAX_SPEED - ASTEROID_MIN_SPEED) + ASTEROID_MIN_SPEED;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                // Shape randomization
                this.vertices = Math.floor(Math.random() * 5) + 7;
                this.offsets = [];
                for (let i = 0; i < this.vertices; i++) {
                    this.offsets.push(Math.random() * 0.4 + 0.8);
                }
            }

            draw() {
                ctx.strokeStyle = "#94a3b8";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let i = 0; i < this.vertices; i++) {
                    const angle = (i / this.vertices) * Math.PI * 2;
                    const radius = this.r * this.offsets[i];
                    const px = this.x + radius * Math.cos(angle);
                    const py = this.y + radius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Wrap
                if (this.x < 0 - this.r) this.x = canvas.width + this.r;
                else if (this.x > canvas.width + this.r) this.x = 0 - this.r;
                if (this.y < 0 - this.r) this.y = canvas.height + this.r;
                else if (this.y > canvas.height + this.r) this.y = 0 - this.r;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 2, 2);
                ctx.globalAlpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha <= 0;
            }
        }

        function initStars() {
            const stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
            return stars;
        }

        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = initStars();
        }

        function startGame() {
            score = 0;
            lives = 3;
            asteroids = [];
            bullets = [];
            particles = [];
            
            scoreVal.innerText = score;
            livesVal.innerText = lives;
            
            ship = new Ship();
            
            // Generate initial asteroids far from ship
            for (let i = 0; i < ASTEROID_COUNT; i++) {
                let ax, ay;
                do {
                    ax = Math.random() * canvas.width;
                    ay = Math.random() * canvas.height;
                } while (dist(ship.x, ship.y, ax, ay) < 200);
                asteroids.push(new Asteroid(ax, ay));
            }

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameActive = true;
        }

        function gameOver() {
            gameActive = false;
            finalScoreText.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        function dist(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function createExplosion(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Input Handling
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Mobile Controls Implementation
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('knob');
        const shootBtn = document.getElementById('shootBtn');

        joystick.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const rect = joystick.getBoundingClientRect();
            joystickOrigin.x = rect.left + rect.width / 2;
            joystickOrigin.y = rect.top + rect.height / 2;
            handleJoystick(e.touches[0]);
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            for (let touch of e.touches) {
                // Find the touch associated with the joystick area
                if (touch.clientX < window.innerWidth / 2) {
                    handleJoystick(touch);
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length === 0 || !Array.from(e.touches).some(t => t.clientX < window.innerWidth / 2)) {
                joystickActive = false;
                knob.style.transform = `translate(-50%, -50%)`;
                mobileThrust = 0;
                mobileRotation = 0;
            }
        });

        function handleJoystick(touch) {
            const dx = touch.clientX - joystickOrigin.x;
            const dy = touch.clientY - joystickOrigin.y;
            const distance = Math.min(60, Math.sqrt(dx*dx + dy*dy));
            const angle = Math.atan2(dy, dx);
            
            const px = Math.cos(angle) * distance;
            const py = Math.sin(angle) * distance;
            
            knob.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
            
            // Use vertical movement for thrust, horizontal for rotation
            // Relative to ship's current orientation would be too complex for a casual mobile game,
            // so we'll map joystick angle directly to ship angle and distance to thrust.
            if (distance > 10) {
                mobileRotation = angle;
                mobileThrust = distance / 60;
            } else {
                mobileThrust = 0;
            }
        }

        shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isMobileShooting = true; });
        shootBtn.addEventListener('touchend', (e) => { isMobileShooting = false; });

        function update() {
            if (!gameActive) return;

            // Movement Logic
            if (joystickActive) {
                // Point towards joystick angle smoothly
                let diff = mobileRotation - ship.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                ship.angle += diff * 0.15;
                ship.thrusting = mobileThrust > 0.3;
            } else {
                ship.rot = 0;
                if (keys['ArrowLeft'] || keys['KeyA']) ship.rot = -SHIP_TURN_SPEED;
                if (keys['ArrowRight'] || keys['KeyD']) ship.rot = SHIP_TURN_SPEED;
                ship.thrusting = keys['ArrowUp'] || keys['KeyW'];
            }

            if (keys['Space'] || isMobileShooting) ship.shoot();

            ship.update();

            // Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                if (bullets[i].update()) {
                    bullets.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (particles[i].update()) {
                    particles.splice(i, 1);
                }
            }

            // Asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.update();

                // Ship collision
                if (!ship.invulnerable && dist(ship.x, ship.y, a.x, a.y) < ship.r + a.r) {
                    lives--;
                    livesVal.innerText = lives;
                    createExplosion(ship.x, ship.y, "#ef4444", 20);
                    
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        // Reset ship position safely
                        ship.x = canvas.width / 2;
                        ship.y = canvas.height / 2;
                        ship.vel = { x: 0, y: 0 };
                        ship.invulnerable = true;
                        ship.blinkTime = 120;
                    }
                }

                // Bullet collision
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (dist(b.x, b.y, a.x, a.y) < a.r) {
                        // Explode asteroid
                        createExplosion(a.x, a.y, "#94a3b8", 10);
                        
                        // Split asteroid
                        if (a.level > 1) {
                            asteroids.push(new Asteroid(a.x, a.y, a.r / 2, a.level - 1));
                            asteroids.push(new Asteroid(a.x, a.y, a.r / 2, a.level - 1));
                        }
                        
                        score += a.level * 100;
                        scoreVal.innerText = score;
                        
                        asteroids.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }
            }

            // Repopulate asteroids
            if (asteroids.length < ASTEROID_COUNT) {
                let ax, ay;
                do {
                    ax = Math.random() * canvas.width;
                    ay = Math.random() * canvas.height;
                } while (dist(ship.x, ship.y, ax, ay) < 200);
                asteroids.push(new Asteroid(ax, ay));
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.globalAlpha = s.opacity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            if (!gameActive) return;

            asteroids.forEach(a => a.draw());
            bullets.forEach(b => b.draw());
            particles.forEach(p => p.draw());
            ship.draw();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            resize();
            window.addEventListener('resize', resize);
            loop();
        };
    </script>
</body>
</html>
