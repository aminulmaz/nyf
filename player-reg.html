<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Registration | HSL Night Cricket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #F9FAFB; }
        .font-heading { font-family: 'Inter', sans-serif; font-weight: 900; }
        .text-gradient { background-image: linear-gradient(90deg, #3b82f6, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .panel-modern { background-color: #1F2937; border: 1px solid #374151; border-radius: 0.75rem; }
        .form-input { background-color: #374151; border: 1px solid #4b5563; border-radius: 0.5rem; transition: all 0.2s ease; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); }
        .btn-primary { background-image: linear-gradient(90deg, #3b82f6 0%, #ec4899 100%); color: white; font-weight: 700; border-radius: 9999px; transition: all 0.3s ease; }
        .btn-primary:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
        .btn-primary:disabled { background-image: none; background-color: #4b5563; cursor: not-allowed; }
        .radio-label { border: 1px solid #4b5563; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s ease; }
        input[type="radio"]:checked + .radio-label { border-color: #3b82f6; background-color: #374151; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); }
        .file-label { border: 2px dashed #4b5563; border-radius: 0.5rem; transition: all 0.2s ease; }
        .file-label:hover { border-color: #3b82f6; }
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); transition: bottom 0.5s ease-in-out; }
    </style>
</head>
<body class="py-12 px-4">
    <div class="max-w-3xl mx-auto">
        <a href="index.html" class="text-3xl font-heading text-white text-center block mb-8">HSL<span class="text-gradient">Cricket</span></a>
        
        <div class="panel-modern p-6 sm:p-8">
            <h1 class="font-heading text-3xl text-center mb-8">Player Registration</h1>
            
            <!-- Step 1: Payment -->
            <div class="mb-8">
                <h2 class="font-bold text-xl mb-4 text-center"><span class="text-gradient">Step 1:</span> Complete Your Payment</h2>
                <p class="text-center text-gray-400 mb-4">Please pay the registration fee by scanning the UPI QR code below. Take a screenshot of the successful payment to upload in the next step.</p>
                <div class="flex justify-center">
                    <img src="media/qrcmode.jpg" alt="Payment QR Code" class="rounded-lg">
                </div>
            </div>

            <!-- Step 2: Form -->
            <form id="registration-form">
                <h2 class="font-bold text-xl mb-6 text-center"><span class="text-gradient">Step 2:</span> Fill Your Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="fullName" class="block mb-2 font-semibold">Full Name</label>
                        <input type="text" id="fullName" class="form-input w-full p-3" placeholder="e.g., John Doe" required>
                    </div>
                    <div>
                        <label for="phone" class="block mb-2 font-semibold">Phone Number</label>
                        <input type="tel" id="phone" class="form-input w-full p-3" placeholder="e.g., 9876543210" required>
                    </div>
                    <div class="md:col-span-2">
                        <label for="email" class="block mb-2 font-semibold">Email Address</label>
                        <input type="email" id="email" class="form-input w-full p-3" placeholder="e.g., john.doe@example.com" required>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block mb-2 font-semibold">Address</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="radio" name="address" id="hailakandi" value="Hailakandi" class="sr-only" required>
                            <label for="hailakandi" class="radio-label text-center p-3">Hailakandi</label>
                             <input type="radio" name="address" id="silchar" value="Silchar" class="sr-only">
                            <label for="silchar" class="radio-label text-center p-3">Silchar</label>
                             <input type="radio" name="address" id="sribhumi" value="Sribhumi (Karimganj)" class="sr-only">
                            <label for="sribhumi" class="radio-label text-center p-3">Sribhumi</label>
                        </div>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block mb-2 font-semibold">Primary Playing Role</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <input type="radio" name="playingRole" id="batsman" value="Batsman" class="sr-only" required>
                            <label for="batsman" class="radio-label text-center p-3">Batsman</label>
                            <input type="radio" name="playingRole" id="bowler" value="Bowler" class="sr-only">
                            <label for="bowler" class="radio-label text-center p-3">Bowler</label>
                            <input type="radio" name="playingRole" id="all-rounder" value="All-Rounder" class="sr-only">
                            <label for="all-rounder" class="radio-label text-center p-3">All-Rounder</label>
                             <input type="radio" name="playingRole" id="wicketkeeper" value="Wicketkeeper" class="sr-only">
                            <label for="wicketkeeper" class="radio-label text-center p-3">Wicketkeeper</label>
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block mb-2 font-semibold">Upload Player Photo (Max 2MB)</label>
                        <label class="file-label flex flex-col items-center justify-center w-full p-6 cursor-pointer">
                            <span id="photo-filename" class="text-gray-400">Click to upload</span>
                            <input type="file" id="playerPhoto" class="sr-only" accept="image/*" required>
                        </label>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block mb-2 font-semibold">Upload Payment Proof (Screenshot, Max 1MB)</label>
                         <label class="file-label flex flex-col items-center justify-center w-full p-6 cursor-pointer">
                            <span id="payment-filename" class="text-gray-400">Click to upload</span>
                            <input type="file" id="paymentProof" class="sr-only" accept="image/*" required>
                        </label>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="btn-primary w-full py-4 mt-8 text-lg">Submit Registration</button>
            </form>
        </div>
    </div>
    
    <div id="toast" class="panel-modern p-4 text-white">Message</div>

    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const form = document.getElementById('registration-form');
        const submitBtn = document.getElementById('submit-btn');
        const playerPhotoInput = document.getElementById('playerPhoto');
        const paymentProofInput = document.getElementById('paymentProof');

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.backgroundColor = isError ? '#7f1d1d' : '#15803d';
            toast.style.bottom = '20px';
            setTimeout(() => { toast.style.bottom = '-100px'; }, 3000);
        }

        playerPhotoInput.addEventListener('change', () => {
            document.getElementById('photo-filename').textContent = playerPhotoInput.files[0]?.name || 'Click to upload';
        });
        paymentProofInput.addEventListener('change', () => {
            document.getElementById('payment-filename').textContent = paymentProofInput.files[0]?.name || 'Click to upload';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const playerPhotoFile = playerPhotoInput.files[0];
            const paymentProofFile = paymentProofInput.files[0];

            // File size validation
            if (playerPhotoFile.size > 2 * 1024 * 1024) {
                showToast('Player photo must be less than 2MB.', true);
                submitBtn.disabled = false; submitBtn.textContent = 'Submit Registration'; return;
            }
            if (paymentProofFile.size > 1 * 1024 * 1024) {
                showToast('Payment proof must be less than 1MB.', true);
                submitBtn.disabled = false; submitBtn.textContent = 'Submit Registration'; return;
            }

            try {
                // Upload files and get URLs
                const photoURL = await uploadFile(playerPhotoFile, 'player_photos');
                const paymentURL = await uploadFile(paymentProofFile, 'payment_proofs');
                
                // Save form data to Firestore
                await addDoc(collection(db, 'registrations'), {
                    fullName: form.fullName.value,
                    phone: form.phone.value,
                    email: form.email.value,
                    address: form.address.value,
                    playingRole: form.playingRole.value,
                    playerPhotoURL: photoURL,
                    paymentProofURL: paymentURL,
                    status: 'pending', // default status
                    createdAt: serverTimestamp()
                });

                showToast('Registration submitted successfully!');
                form.reset();
                document.getElementById('photo-filename').textContent = 'Click to upload';
                document.getElementById('payment-filename').textContent = 'Click to upload';

            } catch (error) {
                console.error("Error submitting registration:", error);
                showToast('An error occurred. Please try again.', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Registration';
            }
        });

        function uploadFile(file, path) {
            return new Promise((resolve, reject) => {
                const storageRef = ref(storage, `${path}/${Date.now()}-${file.name}`);
                const uploadTask = uploadBytesResumable(storageRef, file);

                uploadTask.on('state_changed', 
                    (snapshot) => { /* Can be used to show upload progress */ }, 
                    (error) => reject(error), 
                    () => {
                        getDownloadURL(uploadTask.snapshot.ref).then((downloadURL) => {
                            resolve(downloadURL);
                        });
                    }
                );
            });
        }
    </script>
</body>
</html>
